[project]
name = "qwen-tts-voice-cloning"
version = "0.1.0"
description = "Voice cloning with Qwen3-TTS -- Laxmikant"
requires-python = ">=3.12"
dependencies = [
    "qwen-tts",
    "soundfile",
    "numpy",
    "torch",
    "torchaudio",
    "ipykernel",
    "jupyter",
    "packaging<26",
    "openai-whisper>=20250625",
    "bitsandbytes>=0.49.2",
]

[tool.uv.sources]
torch     = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
